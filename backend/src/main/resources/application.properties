server.port=${PORT:8085}
spring.application.name=joel-and-egay-inventory-backend

# Database Configuration (Railway PostgreSQL / Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://tramway.proxy.rlwy.net:16031/railway}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:sUIgiQKZnMcnJzHoiMMJgDnSXWwgGMau}}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Supabase REST and API Credentials (Optional)
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}

# CORS & Application configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
